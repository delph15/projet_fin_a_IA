version: "3.8"

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Fuseau horaire
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      # Désactiver l'authentification en développement local
      - N8N_BASIC_AUTH_ACTIVE=false
    volumes:
      # Persistance des workflows n8n
      - n8n_data:/home/node/.n8n
      # Accès aux factures depuis le conteneur
      - ./donnees:/data/factures
    extra_hosts:
      # Permet à n8n d'atteindre l'API FastAPI et Ollama sur Windows
      - "host.docker.internal:host-gateway"

volumes:
  n8n_data:
